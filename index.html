<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Calculatrice</title>
  <link rel="stylesheet" href="calculatrice.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="calculatrice.js" defer></script>
</head>
<body>
  <div class="calculatrice">
    <div class="résultat">
      <input type="text" id="fenetre" readonly>
      <div class="info"></div>
    </div>

    <div class="buttons">
      <!-- Ligne 1 -->
      <button onclick="val('7')">7</button>
      <button onclick="val('8')">8</button>
      <button onclick="val('9')">9</button>
      <button onclick="val('+')">+</button>

      <!-- Ligne 2 -->
      <button onclick="val('4')">4</button>
      <button onclick="val('5')">5</button>
      <button onclick="val('6')">6</button>
      <button onclick="val('-')">-</button>

      <!-- Ligne 3 -->
      <button onclick="val('1')">1</button>
      <button onclick="val('2')">2</button>
      <button onclick="val('3')">3</button>
      <button onclick="val('*')">*</button>

      <!-- Ligne 4 -->
      <button onclick="val('0')">0</button>
      <button onclick="val('.')">.</button>
      <button onclick="val('/')">/</button>
      <button onclick="calcul()">=</button>

      <!-- Fonctions scientifiques -->
      <button onclick="sinus()">sin</button>
      <button onclick="cosinus()">cos</button>
      <button onclick="tangente()">tan</button>
      <button onclick="racine()">√</button>

      <button onclick="logarithme()">log</button>
      <button onclick="puissance2()">x²</button>
      <button onclick="inverse()">1/x</button>
      <button onclick="pourcentage()">%</button>

      <!-- Contrôles -->
      <button onclick="suppr()">C</button>
      <button onclick="backspace()">⌫</button>
      <button onclick="startVoice()">🎤</button>
      <button onclick="plotSin()">📈</button>
    </div>

    <canvas id="graph"></canvas>
  </div>
</body>
</html>
